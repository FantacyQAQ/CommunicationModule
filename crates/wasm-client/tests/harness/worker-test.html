<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SharedWorker Test Harness</title></head>
<body>
    <div id="status">init</div>
    <script type="module">
        // Connect to the SharedWorker and expose a Promise-based API for Playwright tests
        const worker = new SharedWorker('../../workspace/matrix-worker.js', { type: 'module' });
        const port = worker.port;

        let requestId = 0;
        const pending = new Map();

        port.onmessage = (e) => {
            const msg = e.data;
            // Log all messages for debugging
            console.log('[harness] received:', JSON.stringify(msg));
            if (msg.id !== undefined) {
                const p = pending.get(msg.id);
                if (p) {
                    pending.delete(msg.id);
                    if (msg.error) p.reject(new Error(msg.error));
                    else p.resolve(msg.result);
                }
            } else {
                // Broadcast event - store for tests to inspect
                if (!window.__workerEvents) window.__workerEvents = [];
                window.__workerEvents.push(msg);
                if (msg.type === 'worker.ready') {
                    document.getElementById('status').textContent = 'ready';
                }
            }
        };

        port.start();

        window.__workerCall = (method, params = {}) => {
            return new Promise((resolve, reject) => {
                const id = ++requestId;
                pending.set(id, { resolve, reject });
                console.log('[harness] sending:', { id, method, params });
                port.postMessage({ id, method, params });
                // Timeout after 10 seconds
                setTimeout(() => {
                    if (pending.has(id)) {
                        pending.delete(id);
                        reject(new Error(`Timeout: ${method}`));
                    }
                }, 10000);
            });
        };

        window.__workerEvents = [];

        console.log('[harness] SharedWorker created, waiting for ready...');
        // Fallback: mark ready after short delay
        setTimeout(() => {
            if (document.getElementById('status').textContent === 'init') {
                document.getElementById('status').textContent = 'ready_timeout';
                console.log('[harness] No worker.ready received, fallback to timeout');
            }
        }, 3000);
    </script>
</body>
</html>
