[package]
name = "wasm-client"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# Matrix SDK with WASM support (IndexedDB storage + E2E encryption)
matrix-sdk = { version = "0.18.0", default-features = false, features = [
    "indexeddb",
    "e2e-encryption",
    "js",
] }

# WASM interop
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"

# Random number generation for WASM (both 0.3 and 0.4 needed by transitive deps)
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Logging (via wasm-bindgen console)
tracing = "0.1"
tracing-web = "0.1"


