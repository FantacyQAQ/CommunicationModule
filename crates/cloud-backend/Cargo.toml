[package]
name = "cloud-backend"
version.workspace = true
edition.workspace = true

[dependencies]
# Matrix SDK (server-side bot with SQLite storage)
matrix-sdk = { version = "0.18.0", features = ["sqlite", "e2e-encryption"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (REST API for Java backend)
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (room mapping, user credentials)
rusqlite = { version = "0.37", features = ["bundled"] }

# Config
toml = "1"

# gRPC
tonic = "0.13"
prost = "0.13"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (Conduit Admin API)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[build-dependencies]
tonic-build = "0.13"
