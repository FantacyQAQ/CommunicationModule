# Conduwuit Matrix Homeserver for local development
#
# Usage:
#   podman compose up -d          # Start in background
#   podman compose down           # Stop and remove
#   podman compose logs -f        # Follow logs
#
# Client-Server API: http://localhost:8008
# Admin:             http://localhost:8008/_matrix/client/v3/admin

services:
  homeserver:
    # Conduit Matrix homeserver for containerized development.
    # Compatible with Conduwuit API (both implement Matrix Client-Server spec).
    image: docker.io/matrixconduit/matrix-conduit:latest
    container_name: matrix-homeserver
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - ./data/conduit:/data:z
      - ./conduit-config.toml:/etc/conduit.toml:ro,z
    environment:
      CONDUIT_CONFIG: "/etc/conduit.toml"
